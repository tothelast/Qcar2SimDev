# @package _global_
defaults:
  - /data_module: carla_bucket_v12_dreamer
  - /model/vision_model: vlm
  - /data_module/base_dataset: dataset

model:
  lr: 3e-5
  predict_route_as_wps: True
  speed_wps_mode: 2d
  language_model:
    variant: '/home/garegin/Documents/Qcar2SimDev/pretrained/InternVL2-1B'
    lora: True
    lora_alpha: 64
    lora_r: 32
    lora_dropout: 0.1
  vision_model:
    variant: '/home/garegin/Documents/Qcar2SimDev/pretrained/InternVL2-1B'

data_module:
  batch_size: 1
  num_workers: 1
  train_partitions: null
  train_partitions_dreamer: null
  # dreamer_dataset: null
  base_dataset:
    data_path: test_data_temp
    bucket_path: data/buckets
    pred_len: 11
    cut_bottom_quarter: False
    use_commentary: False
    use_qa: False
    qa_augmentation: False
    img_shift_augmentation: False
    img_shift_augmentation_prob: 0.0
    hist_len: 1
    route_as: target_point
    use_lmdrive_commands: False
    use_old_towns: False
    use_town13: False
    use_safety_flag: False

max_epochs: 1
val_every_n_epochs: 1

debug: true
overfit: 2  # Only use 2 batches to save memory
gpus: 1
seed: 42
name: test_quick_validation
resume: False
checkpoint: /home/garegin/Documents/Qcar2SimDev/models/simlingo/checkpoints/epoch=013.ckpt

hydra:
  run:
    dir: outputs/${wandb_name}_${name}