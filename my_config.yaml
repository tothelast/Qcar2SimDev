model:
  lr: 2e-5
  predict_route_as_wps: True
  speed_wps_mode: 2d
  weight_decay: 0.1
  betas: [0.9, 0.999]
  pct_start: 0.05
  _target_: simlingo_training.models.driving.DrivingModel
  
  language_model:
    variant: 'OpenGVLab/InternVL2-1B'
    lora: True
    lora_alpha: 64
    lora_r: 32
    lora_dropout: 0.1
    _target_: simlingo_training.models.language_model.llm.LLM
    
  vision_model:
    variant: 'OpenGVLab/InternVL2-1B'
    freeze: true
    embed_dim: 512
    _target_: simlingo_training.models.encoder.vlm.VLMEncoderModel

data_module:
  batch_size: 1
  num_workers: 0
  train_partitions: null
  train_partitions_dreamer: null
  use_global_img: false
  _target_: simlingo_training.dataloader.datamodule.DataModule
  
  driving_dataset:
    _target_: simlingo_training.dataloader.dataset_driving.Data_Driving
    data_path: database
    bucket_path: ''
    
  dreamer_dataset: null
  qa_dataset: null
  insteval_dataset: null
  
  base_dataset:
    data_path: database
    bucket_path: ''
    pred_len: 11
    hist_len: 1
    skip_first_n_frames: 10
    route_as: target_point
    use_commentary: False
    use_qa: False
    qa_augmentation: False
    commentary_augmentation: False
    img_augmentation: False
    img_augmentation_prob: 0.0
    img_shift_augmentation: False
    img_shift_augmentation_prob: 0.0
    use_lmdrive_commands: False
    use_old_towns: False
    use_only_old_towns: False
    use_town13: False
    cut_bottom_quarter: False
    num_route_points: 20
    use_1d_wps: false
    use_safety_flag: false

max_epochs: 15
precision: 16-mixed
strategy: deepspeed_stage_2
gpus: 1
seed: 42
accumulate_grad_batches: 4
name: qlabs_roundabout_finetune
resume: False
checkpoint: /home/garegin/Documents/Projects/Qcar2SimDev/models/simlingo/checkpoints/epoch=013.ckpt
wandb_project: simlingo_qlabs
fp16_loss_scale: 32.0
enable_wandb: false
